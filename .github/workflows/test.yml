name: Test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:extension
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-firefox-extension
          path: dist/*
